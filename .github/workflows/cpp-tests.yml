name: C++ algorithmsHash Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: 
      group: k23a

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev

    - name: Build
      run: |
           cmake --build build -- -j$(nproc) test_algorithms
           cmake --build build -- -j$(nproc) test_indexing
           cmake --build build -- -j$(nproc) ex2_task3_hashes_tests

    - name: Run tests
      working-directory: build
      run: |
       ./test_algorithms 
       ./test_indexing
       ./ex2_task3_hashes_tests
